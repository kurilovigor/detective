name: Build and Release DETECTive

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Determine Version
      id: get_version
      shell: pwsh
      run: |
        $ref = "${{ github.ref_name }}"
        if ($ref -match '^v?([0-9]+\.[0-9]+\.[0-9]+.*)$') {
          $version = $Matches[1]
        } else {
          $version = "1.0.0"
        }
        Write-Output "App version: $version"
        "APP_VERSION=$version" >> $env:GITHUB_OUTPUT
        "APP_VERSION=$version" >> $env:GITHUB_ENV

    - name: Run Unit Tests
      run: dotnet test --configuration Release --verbosity normal

    - name: Publish Application (win-x64)
      run: |
        dotnet publish Detective/Detective.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -p:Version=${{ steps.get_version.outputs.APP_VERSION }} `
          -o ./publish

    - name: Install Inno Setup
      run: choco install innosetup --no-progress

    - name: Compile Inno Setup Installer
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path ./dist | Out-Null
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)?.Source
        }
        if (-not $iscc -or -not (Test-Path $iscc)) {
          $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
        }
        & $iscc /DAppVersion=${{ steps.get_version.outputs.APP_VERSION }} installer/detective.iss

    - name: Create Portable ZIP Archive
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.APP_VERSION }}"
        Compress-Archive -Path ./publish/* -DestinationPath "./dist/Detective-$version-win-x64.zip" -Force

    - name: Generate Checksums
      shell: pwsh
      working-directory: ./dist
      run: |
        Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
          $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($_.Name)"
        } | Out-File -Encoding utf8 SHA256SUMS.txt
        Get-Content SHA256SUMS.txt

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Detective-Windows-Release
        path: ./dist/*

    - name: Publish to GitHub Releases
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true

